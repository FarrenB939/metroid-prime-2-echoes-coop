$Echoes co-op (all features: A, B, D, E, C, F, G, H, I, K, L, J)
*Gated on rs5mp2_p.dol being resident; R3ME01 rev 0 only.
*A: Echoes co-op: keep inventory on spawn (respawns keep, start items only once)
*B: Echoes co-op: campaign session (Sidehopper Station starts or continues the co-op save file; no time/kill limit)
*D: Echoes co-op: full-screen cinematics (every cinematic camera runs on P1 and takes the whole screen)
*E: Echoes co-op: Scan Visor works and no friendly fire
*C: Echoes co-op: shared room transitions (any player opens the next room; others follow)
*F: Echoes co-op: enemies fight the nearest player (not only player 1)
*G: Echoes co-op: save stations work (needs code E for the save screen)
*H: Echoes co-op: item pickups go to every player
*I: Echoes co-op: scan progress is shared
*K: Echoes co-op: map screen works (button 1, player 1)
*L: Echoes co-op: shared lives (Kill Limit / 5 per player, refilled when saving; 0 = off)
*J: Echoes co-op: upgrades given by scripts go to every player
